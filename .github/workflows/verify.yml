name: Verify bootstrap
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      # One source of truth: the same script as local CI (clean-room guard, design import and token
      # parity, golden rule cases, Gradle tests/build/lint, the merged-manifest permission guard for the
      # default build and for the bleTransport-on build).
      - run: ./tools/ci.sh
